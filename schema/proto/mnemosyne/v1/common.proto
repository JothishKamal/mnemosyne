syntax = "proto3";
package mnemosyne.v1;
option go_package = "github.com/ai-mond/mnemosyne/schema/gen/go/mnemosyne/v1;mnemosynev1";

message EventID {
  bytes  emitter_id = 1;
  uint64 sequence   = 2;
}

message HLC {
  uint64 wall_ms = 1;
  uint32 logical = 2;
}

message Service {
  string name        = 1;
  string version     = 2;
  bytes  emitter_id  = 3;
}

message ErrorInfo {
  string type    = 1;
  string message = 2;
}

message Value {
  oneof kind {
    string string_value = 1;
    int64  int_value    = 2;
    double double_value = 3;
    bool   bool_value   = 4;
  }
}
